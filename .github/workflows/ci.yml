name: CI & Inno Setup Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Inno Setup Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: versioning
        shell: pwsh
        run: |
          $ver = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}"
          } elseif ($env:GITHUB_REF -match '^refs/tags/v?(.*)$') {
            $ver = $matches[1]
          } else {
            $ver = "1.0.${{ github.run_number }}"
          }
          Write-Host "Computed Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore NetPulse/NetPulse.csproj

      - name: Build project
        run: dotnet build NetPulse/NetPulse.csproj -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Publish application (win-x64 self-contained)
        shell: pwsh
        run: |
          dotnet publish NetPulse/NetPulse.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ env.VERSION }} `
            -o ./publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Compile Inno Setup Script (Setup / Update installer)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "ISCC.exe"
          }
          & $iscc `
            "/DMyAppVersion=${{ env.VERSION }}" `
            "/DSourceDir=..\publish" `
            "/DOutputDir=output" `
            installer\NetPulse.iss

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          $setupPath = "installer\output\NetPulse-Setup.exe"
          if (Test-Path $setupPath) {
            $item = Get-Item $setupPath
            Write-Host "Setup successfully compiled: $($item.FullName) ($([math]::Round($item.Length / 1MB, 2)) MB)"
          } else {
            Write-Error "NetPulse-Setup.exe was not created!"
            exit 1
          }

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Setup-v${{ env.VERSION }}
          path: installer/output/NetPulse-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (on tags or manual release dispatch)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/NetPulse-Setup.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: NetPulse v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

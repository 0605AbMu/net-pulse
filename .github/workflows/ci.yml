name: NetPulse CI & Versioned Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chiqariladigan versiya (masalan: 1.0.1, bo`sh qoldirilsa csproj dan olinadi)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # 1. CI Tekshiruvi: Har bir push va pull request kodni to'g'ri yig'ilishini tekshiradi
  validate:
    name: Validate Build (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NetPulse/NetPulse.csproj

      - name: Build project
        run: dotnet build NetPulse/NetPulse.csproj -c Release --no-restore

  # 2. Versiyalangan Release va Inno Setup paketi:
  # Faqat versiya tegi qo'yilganda (v1.0.0 kabi) yoki qo'lda versiya bilan ishga tushirilganda ishlaydi
  release:
    name: Package & Release Version
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Version
        id: get_version
        shell: pwsh
        run: |
          $ver = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}".Trim().TrimStart('v')
          } elseif ($env:GITHUB_REF -match '^refs/tags/v?(.*)$') {
            $ver = $matches[1]
          }

          # Agar versiya topilmasa, NetPulse.csproj dan o'qish
          if ([string]::IsNullOrWhiteSpace($ver)) {
            [xml]$proj = Get-Content "NetPulse/NetPulse.csproj"
            $ver = $proj.Project.PropertyGroup.Version
          }

          if ([string]::IsNullOrWhiteSpace($ver)) {
            Write-Error "Versiya aniqlanmadi!"
            exit 1
          }

          Write-Host "Aniqlangan Versiya: $ver" -ForegroundColor Green
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore NetPulse/NetPulse.csproj

      - name: Publish application (win-x64 self-contained with version)
        shell: pwsh
        run: |
          dotnet publish NetPulse/NetPulse.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ env.VERSION }} `
            -p:AssemblyVersion=${{ env.VERSION }} `
            -p:FileVersion=${{ env.VERSION }} `
            -p:InformationalVersion=${{ env.VERSION }} `
            -o ./publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "ISCC.exe"
          }

          & $iscc `
            "/DMyAppVersion=${{ env.VERSION }}" `
            "/DOutputBaseFilename=NetPulse-Setup-v${{ env.VERSION }}" `
            "/DSourceDir=..\publish" `
            "/DOutputDir=output" `
            installer\NetPulse.iss

      - name: Prepare Artifacts & Checksums
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}"
          $outputDir = "installer\output"
          $versionedExe = Join-Path $outputDir "NetPulse-Setup-v$ver.exe"
          $genericExe = Join-Path $outputDir "NetPulse-Setup.exe"

          if (-not (Test-Path $versionedExe)) {
            Write-Error "O'rnatuvchi fayl topilmadi: $versionedExe"
            exit 1
          }

          # Generic nusxasini ham yaratamiz (avto-yangilovchi URL lari uchun qulay bo'lishi uchun)
          Copy-Item $versionedExe $genericExe -Force

          # SHA256 checksum hisoblash
          $hashVersioned = (Get-FileHash -Algorithm SHA256 $versionedExe).Hash
          $hashGeneric = (Get-FileHash -Algorithm SHA256 $genericExe).Hash
          
          $checksumContent = @"
$hashVersioned  NetPulse-Setup-v$ver.exe
$hashGeneric  NetPulse-Setup.exe
"@
          Set-Content -Path (Join-Path $outputDir "checksums.txt") -Value $checksumContent -Encoding UTF8

          # Yangilanishlarni tekshirish uchun version.json metadata fayli
          $dateStr = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssZ")
          $versionMeta = @"
{
  "version": "$ver",
  "releaseDate": "$dateStr",
  "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v$ver/NetPulse-Setup-v$ver.exe",
  "checksumSha256": "$hashVersioned"
}
"@
          Set-Content -Path (Join-Path $outputDir "version.json") -Value $versionMeta -Encoding UTF8
          Write-Host "Barcha chiqarish fayllari muvaffaqiyatli tayyorlandi:" -ForegroundColor Green
          Get-ChildItem $outputDir | Select-Object Name, Length

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-v${{ env.VERSION }}
          path: |
            installer/output/NetPulse-Setup-v${{ env.VERSION }}.exe
            installer/output/NetPulse-Setup.exe
            installer/output/checksums.txt
            installer/output/version.json
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/NetPulse-Setup-v${{ env.VERSION }}.exe
            installer/output/NetPulse-Setup.exe
            installer/output/checksums.txt
            installer/output/version.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: NetPulse v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: NetPulse CI & Versioned Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chiqariladigan versiya (masalan: 1.0.1, bo`sh qoldirilsa csproj dan olinadi)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # 1. CI Tekshiruvi: Har bir push va pull request kodni to'g'ri yig'ilishini tekshiradi
  validate:
    name: Validate Build (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NetPulse/NetPulse.csproj

      - name: Build project
        run: dotnet build NetPulse/NetPulse.csproj -c Release --no-restore

  # 2. Versiyalangan Release: Faqatgina tag bilan versiya qo'yilganda (masalan v1.0.1) ishlaydi
  # main branchga push yoki merge qilinganda bu bosqich ishlamaydi (faqat validate build bilan cheklanadi)
  release:
    name: Package & Release (.exe)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Version
        id: get_version
        shell: pwsh
        run: |
          $ver = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}".Trim().TrimStart('v')
          } elseif ($env:GITHUB_REF -match '^refs/tags/v?(.*)$') {
            $ver = $matches[1]
          }

          # Agar versiya topilmasa, NetPulse.csproj dan o'qish
          if ([string]::IsNullOrWhiteSpace($ver)) {
            [xml]$proj = Get-Content "NetPulse/NetPulse.csproj"
            $ver = $proj.Project.PropertyGroup.Version
          }

          if ([string]::IsNullOrWhiteSpace($ver)) {
            Write-Error "Versiya aniqlanmadi!"
            exit 1
          }

          Write-Host "Aniqlangan Versiya: $ver" -ForegroundColor Green
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore NetPulse/NetPulse.csproj

      # 2.1. Dasturning o'zini (Portable Single-File .exe) yaratish
      - name: Publish Portable Standalone App (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./dist" -Force | Out-Null

          dotnet publish NetPulse/NetPulse.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ env.VERSION }} `
            -p:AssemblyVersion=${{ env.VERSION }} `
            -p:FileVersion=${{ env.VERSION }} `
            -p:InformationalVersion=${{ env.VERSION }} `
            -o ./portable

          Copy-Item ./portable/NetPulse.exe "./dist/NetPulse-v${{ env.VERSION }}-Portable.exe" -Force
          Copy-Item ./portable/NetPulse.exe "./dist/NetPulse.exe" -Force
          Write-Host "Portable dastur yaratildi: dist/NetPulse-v${{ env.VERSION }}-Portable.exe" -ForegroundColor Green

      # 2.2. O'rnatuvchi (Inno Setup Installer .exe) uchun fayllarni publish qilish
      - name: Publish files for Inno Setup
        shell: pwsh
        run: |
          dotnet publish NetPulse/NetPulse.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ env.VERSION }} `
            -p:AssemblyVersion=${{ env.VERSION }} `
            -p:FileVersion=${{ env.VERSION }} `
            -p:InformationalVersion=${{ env.VERSION }} `
            -o ./publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      # 2.3. Inno Setup orqali Setup.exe ni yig'ish
      - name: Compile Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "ISCC.exe"
          }

          & $iscc `
            "/DMyAppVersion=${{ env.VERSION }}" `
            "/DOutputBaseFilename=NetPulse-Setup-v${{ env.VERSION }}" `
            "/DSourceDir=..\publish" `
            "/DOutputDir=output" `
            installer\NetPulse.iss

          $installerVer = "installer\output\NetPulse-Setup-v${{ env.VERSION }}.exe"
          if (Test-Path $installerVer) {
            Copy-Item $installerVer "./dist/NetPulse-Setup-v${{ env.VERSION }}.exe" -Force
            Copy-Item $installerVer "./dist/NetPulse-Setup.exe" -Force
            Write-Host "Inno Setup o'rnatuvchi yaratildi: dist/NetPulse-Setup-v${{ env.VERSION }}.exe" -ForegroundColor Green
          } else {
            Write-Error "O'rnatuvchi fayl topilmadi: $installerVer"
            exit 1
          }

      - name: List Release Executables
        shell: pwsh
        run: |
          Write-Host "Chiqariladigan barcha .exe fayllar:" -ForegroundColor Cyan
          Get-ChildItem "./dist" -Filter "*.exe" | Select-Object Name, Length, LastWriteTime

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Executables-v${{ env.VERSION }}
          path: |
            dist/NetPulse-Setup-v${{ env.VERSION }}.exe
            dist/NetPulse-Setup.exe
            dist/NetPulse-v${{ env.VERSION }}-Portable.exe
            dist/NetPulse.exe
          if-no-files-found: error

      # 2.4. GitHub Release sahifasida har ikkalasini (.exe) alohida ko'rinadigan qilib chiqarish
      - name: Publish GitHub Release (Installer & Portable .exe)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetPulse-Setup-v${{ env.VERSION }}.exe
            dist/NetPulse-Setup.exe
            dist/NetPulse-v${{ env.VERSION }}-Portable.exe
            dist/NetPulse.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: NetPulse v${{ env.VERSION }}
          body: |
            ## NetPulse v${{ env.VERSION }} chiqarildi!

            Quyidagi fayllardan birini tanlab yuklab olishingiz mumkin (barchasi to'g'ridan-to'g'ri **`.exe`** formatida):

            ### 📦 1. O'rnatuvchi (Installer):
            - **`NetPulse-Setup-v${{ env.VERSION }}.exe`** — Dasturni to'liq kompyuterga o'rnatish, Ish stoli va Bosh menyuda yorliq yaratish hamda keyinchalik oson yangilash uchun o'rnatuvchi.
            - **`NetPulse-Setup.exe`** — Doimiy universal havoladagi o'rnatuvchi.

            ### 🚀 2. Dasturning o'zi (Portable Standalone):
            - **`NetPulse-v${{ env.VERSION }}-Portable.exe`** — O'rnatish talab etilmaydigan, to'g'ridan-to'g'ri ishga tushadigan dasturning o'zi (Single-file).
            - **`NetPulse.exe`** — Universal nomdagi dasturning o'zi.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
